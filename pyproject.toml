[project]
name = "capybot-ai"
version = "0.3.0"
description = "Evidence-first BOSS job-search decision agent with real MCP tool calling"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "the Capybot contributors"}]
keywords = ["ai", "agent", "mcp", "job-search", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "ddgs>=9.5.5,<10.0.0",
    "httpx>=0.28.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "openai>=2.8.0",
    "pypdf>=5.0.0,<6.0.0",
    "pymupdf>=1.25.0",
    "playwright>=1.49.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "openai-agents>=0.6.0,<1.0.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
capybot = "capybot.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "capybot/**/*.py",
    "capybot/**/*.md",
    "capybot/**/*.json",
    "capybot/web/dist/**/*",
]
# capybot/web/dist/ is produced by `cd webui && npm run build` and is
# git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "capybot/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["capybot"]

[tool.hatch.build.targets.wheel.sources]
"capybot" = "capybot"

[tool.hatch.build.targets.sdist]
include = [
    "capybot/",
    "capybot/web/dist/",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["capybot"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
